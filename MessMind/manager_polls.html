<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>MessMind | Voting Analytics</title>

    <style>
        .page-container { max-width: 1000px; margin: 0 auto; padding: 2rem; }

        .stats-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(249,115,22,0.3); border-radius: 10px; padding: 1.5rem; text-align: center; }

        .stat-value { color: #f97316; font-size: 2rem; font-weight: 700; }
        .stat-label { color: #78716c; font-size: 0.9rem; margin-top: 0.5rem; }

        .results-grid { display: grid; gap: 1rem; }

        .result-card { background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(249,115,22,0.2); border-radius: 12px; padding: 1.5rem; transition: transform 0.2s ease, box-shadow 0.2s ease; animation: fadeSlideUp 0.4s ease both; }
        .result-card:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -14px rgba(120,72,32,0.25); }

        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }

        .dish-name { color: #2d2a26; font-size: 1.2rem; font-weight: 600; }

        .vote-badge { background: rgba(249,115,22,0.2); color: #f97316; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.95rem; font-weight: 600; }

        .result-bar { background: rgba(0,0,0,0.04); border-radius: 8px; height: 30px; overflow: hidden; margin-bottom: 0.8rem; }

        .result-fill { background: linear-gradient(90deg, #f97316, #ea580c); height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: flex-end; padding-right: 1rem; font-weight: 600; color: white; }

        .result-stats { display: flex; justify-content: space-between; color: #78716c; font-size: 0.9rem; }

        .rank-badge { background: rgba(249,115,22,0.2); color: #f97316; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; margin-right: 1rem; }

        .empty-state { color: #78716c; text-align: center; padding: 1rem; }
        .donation-panel { display: grid; gap: 1rem; margin-bottom: 2rem; }
        .donation-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
        .donation-actions button { border: 1px solid rgba(249,115,22,0.4); color: #44403c; background: transparent; padding: 0.85rem 1rem; border-radius: 0.75rem; cursor: pointer; transition: background 0.25s ease; }
        .donation-actions button.active, .donation-actions button:hover { background: rgba(249,115,22,0.2); }
        .donation-map { width: 100%; min-height: 360px; border: 1px solid rgba(249,115,22,0.3); border-radius: 14px; overflow: hidden; }
        .donation-panel input { width: 100%; padding: 0.9rem 1rem; border-radius: 0.75rem; border: 1px solid rgba(120,113,108,0.4); color: #2d2a26; background: rgba(255,255,255,0.9); }
        .donation-panel .donation-result { background: rgba(255,255,255,0.8); padding: 1rem; border-radius: 12px; border: 1px solid rgba(249,115,22,0.15); }
    </style>
</head>

<body class="manager-bg">

<div class="page-container">

    <div class="site-header">
        <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="MessMind Logo" class="site-logo">
        <div>
            <div class="site-logo-text">MessMind</div>
            <div class="site-logo-subtitle">Student voting</div>
        </div>
    </div>

    <div style="text-align:center; margin-bottom:1rem;">
        Welcome, <strong>{{ full_name }}</strong> | 
        <a href="/logout" style="color:#dc2626;">Logout</a>
    </div>

    <nav class="nav-tabs">
        <a href="/manager">Dashboard</a>
        <a href="/menu">Weekly Menu</a>
        <a href="/complaints">Complaints & Feedback</a>
        <a href="/manager_polls" class="active">Student Voting</a>
        <a href="/manager_donate">Donations</a>
        <a href="/manager_notifications">Notifications</a>
    </nav>

    <!-- 🔥 LIVE FEED -->
    <div class="glass-card" style="padding:2rem; margin-bottom:2rem;">
        <h2>🔥 Live Student Demands</h2>

        <div id="live-feed">
            <div class="skeleton-line" style="width: 60%;"></div>
            <div class="skeleton-line" style="width: 40%;"></div>
        </div>
    </div>

    <!-- 📊 ANALYTICS -->
    <div class="glass-card" style="padding:2rem;">
        <h1 style="text-align:center;">Voting Analytics</h1>

        <div class="stats-section">
            <div class="stat-card">
                <div id="total-dishes" class="stat-value">0</div>
                <div class="stat-label">Dishes</div>
            </div>

            <div class="stat-card">
                <div id="total-votes" class="stat-value">0</div>
                <div class="stat-label">Votes</div>
            </div>

            <div class="stat-card">
                <div id="top-votes" class="stat-value">0</div>
                <div class="stat-label">Top Votes</div>
            </div>
        </div>

        <div id="results-container" class="results-grid">
            <div class="skeleton-line" style="width: 80%;"></div>
            <div class="skeleton-line" style="width: 55%;"></div>
        </div>
    </div>

</div>

<script>
// 📢 SEND MESSAGE
async function sendMessage() {
    const messageText = document.getElementById('message-text').value.trim();
    const statusEl = document.getElementById('message-status');
    
    if (!messageText) {
        statusEl.textContent = 'Please enter a message';
        statusEl.style.color = '#dc2626';
        return;
    }
    
    statusEl.textContent = 'Sending...';
    statusEl.style.color = '#b45309';
    
    const res = await fetch('/send_message', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: messageText })
    });
    
    const result = await res.json();
    
    if (result.success) {
        statusEl.textContent = 'Message sent successfully!';
        statusEl.style.color = '#16a34a';
        document.getElementById('message-text').value = '';
    } else {
        statusEl.textContent = result.message || 'Error sending message';
        statusEl.style.color = '#dc2626';
    }
}

// 🔥 LIVE FEED
async function loadLiveFeed() {
    const res = await fetch('/get_poll_activity');
    const result = await res.json();

    const container = document.getElementById('live-feed');

    if (result.success && result.data.length > 0) {
        container.innerHTML = result.data.map((item, i) => `
            <div style="background:#fff7ed; padding:10px; margin-bottom:10px; border-radius:8px; transition: transform 0.2s ease; animation: fadeSlideUp 0.35s ease both; animation-delay: ${Math.min(i * 0.05, 0.4)}s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                <b>${item.dish}</b>
                <span style="
                    margin-left:10px;
                    padding:3px 8px;
                    border-radius:10px;
                    background:${item.action === 'suggested' ? '#fb923c' : '#16a34a'};
                    color:white;
                    font-size:12px;
                ">
                    ${item.action}
                </span>
                <div style="font-size:12px; color:#78716c;">
                    👤 ${item.student} | ${item.time}
                </div>
            </div>
        `).join('');
    } else {
        container.innerHTML = "No activity yet";
    }
}


// Animate a stat number counting up from its current value to `target`
function animateCount(el, target, duration = 600) {
    const start = parseFloat(el.textContent) || 0;
    if (start === target) return;
    const startTime = performance.now();
    function tick(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        el.textContent = Math.round(start + (target - start) * progress);
        if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

// 📊 ANALYTICS
async function loadVotingData() {
    const res = await fetch('/get_poll_results');
    const result = await res.json();
    const container = document.getElementById('results-container');

    if (result.success && result.results.length > 0) {
        const results = result.results;
        const totalVotes = results.reduce((sum, r) => sum + r.votes, 0);

        animateCount(document.getElementById('total-dishes'), results.length);
        animateCount(document.getElementById('total-votes'), totalVotes);
        animateCount(document.getElementById('top-votes'), results[0].votes);

        container.innerHTML = results.map((poll, index) => `
            <div class="result-card" style="animation-delay: ${Math.min(index * 0.05, 0.4)}s;">
                <div class="result-header">
                    <div style="display:flex;">
                        <div class="rank-badge">${index + 1}</div>
                        <div class="dish-name">${poll.dish}</div>
                    </div>
                    <div class="vote-badge">${poll.votes} votes</div>
                </div>
            </div>
        `).join('');
    } else if (result.success) {
        container.innerHTML = '<div class="empty-state">No votes yet</div>';
    }
}

function setActiveDonationButton(type) {
    const buttons = ['Orphanage', 'Gaushala', 'Old Age Home'];
    buttons.forEach(key => {
        const btn = document.getElementById('donation-' + key.toLowerCase().replace(/ /g, '-'));
        if (btn) btn.classList.toggle('active', key === type);
    });
}

function selectDonationType(type) {
    document.donationType = type;
    setActiveDonationButton(type);
}

function createMapUrl(query, lat, lon) {
    const encoded = encodeURIComponent(query);
    if (lat && lon) {
        return `https://www.google.com/maps?q=${encoded}&ll=${lat},${lon}&z=14&output=embed`;
    }
    return `https://www.google.com/maps?q=${encoded}&z=14&output=embed`;
}

function updateDonationStatus(message, color = '#57534e') {
    const statusEl = document.getElementById('donation-status');
    statusEl.textContent = message;
    statusEl.style.color = color;
}

async function searchDonationPlaces() {
    const locationInput = document.getElementById('donation-location').value.trim();
    const type = document.donationType || 'Orphanage';
    const query = `${type} near ${locationInput || 'me'}`;
    const mapFrame = document.getElementById('donation-map');

    updateDonationStatus(`Searching nearby ${type.toLowerCase()}...`);

    if (!locationInput && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            mapFrame.src = createMapUrl(query, lat, lon);
            updateDonationStatus(`Showing nearby ${type.toLowerCase()} using your current location.`,'#16a34a');
        }, () => {
            mapFrame.src = createMapUrl(query);
            updateDonationStatus(`Unable to access location. Showing search results by keyword.`,'#b45309');
        });
    } else {
        mapFrame.src = createMapUrl(query);
        updateDonationStatus(`Showing nearby ${type.toLowerCase()} for "${locationInput || 'current location'}".`,'#16a34a');
    }
}

// RUN BOTH
document.addEventListener('DOMContentLoaded', () => {
    loadLiveFeed();
    loadVotingData();
    selectDonationType('Orphanage');

    setInterval(loadLiveFeed, 5000);
    setInterval(loadVotingData, 10000);
});
</script>
<script src="{{ url_for('static', filename='chatbot.js') }}"></script>

</body>
</html>
